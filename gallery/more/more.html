<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="more.css">
    <link rel="stylesheet" href="../../nav.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon 3.png" sizes="32x32">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Everything Burger</title>
</head>
<body>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
        <img src="../../assets/images/BurgerIcon.png" alt="">
    </button>

    <main class="more-page">
        <div class="more-canvas">
            <img
                class="more-banner"
                src="../../assets/GalleryAssets/more/MoreGraphic.png"
                alt="More"
            >

            <img
                class="more-graphic2"
                src="../../assets/GalleryAssets/more/MoreGraphic2.png"
                alt=""
            >

            <div class="more-gap-cover" aria-hidden="true">
                <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <rect width="400" height="120"/>
                </svg>
            </div>

            <div class="more-body">
                <div class="more-gallery">

                    <!-- Copy this segment \/  -->
                    <article class="more-entry">
                        <div class="more-entry__content">
                            <div class="more-entry__image">
                                <img src="../../assets/GalleryAssets/more/MoreExample.png" alt="">
                            </div>
                            <div class="more-entry__info">
                                <h2 class="more-entry__title">Nowhere Tonight</h2>
                                <p class="more-entry__text">Album Artwork for Ridco</p>
                            </div>
                        </div>
                    </article>
                    <!-- Copy this segment ^^  -->
                    <article class="more-entry">
                        <div class="more-entry__content">
                            <div class="more-entry__image">
                                <img src="../../assets/GalleryAssets/more/mug.PNG" alt="">
                            </div>
                            <div class="more-entry__info">
                                <h2 class="more-entry__title">Mug by Peter</h2>
                                <p class="more-entry__text">Made in Anniston AL</p>
                            </div>
                        </div>
                    </article>
                    <article class="more-entry">
                        <div class="more-entry__content">
                            <div class="more-entry__image">
                                <img src="../../assets/GalleryAssets/more/vertigo screengrab.jpg" alt="">
                            </div>
                            <div class="more-entry__info">
                                <h2 class="more-entry__title">Vertigo WIP</h2>
                                <p class="more-entry__text">My goal is to make a rig for the BMPCC4K to automate a vertigo shot.</p>
                            </div>
                        </div>
                    </article>

<article class="more-entry more-entry--book">
    <div class="more-entry__content">
        <div class="more-entry__image">
            <div class="flipbook">
                <div class="flipbook__stage">
                    <button class="flipbook__btn flipbook__btn--prev" type="button" aria-label="Previous page">&#10094;</button>
                    <button class="flipbook__btn flipbook__btn--next" type="button" aria-label="Next page">&#10095;</button>

                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00001.PNG" alt="Page 1">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00002.png" alt="Page 2">
                        </div>
                    </div>
                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00003.png" alt="Page 3">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00004.jpg" alt="Page 4">
                        </div>
                    </div>
                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00005.jpg" alt="Page 5">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00006.jpg" alt="Page 6">
                        </div>
                    </div>
                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00007.jpg" alt="Page 7">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00008.jpg" alt="Page 8">
                        </div>
                    </div>
                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00009.jpg" alt="Page 9">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00010.jpg" alt="Page 10">
                        </div>
                    </div>
                    <div class="flipbook__sheet">
                        <div class="flipbook__face flipbook__face--front">
                            <img src="../../assets/GalleryAssets/more/page00011.jpg" alt="Page 11">
                        </div>
                        <div class="flipbook__face flipbook__face--back">
                            <img src="../../assets/GalleryAssets/more/page00012.jpg" alt="Page 12">
                        </div>
                    </div>
                </div>
                <span class="flipbook__count">1 / 12</span>
            </div>
        </div>
        <div class="more-entry__info">
            <h2 class="more-entry__title">Iron Henry</h2>
            <p class="more-entry__text">Concept Album Art</p>
        </div>
    </div>
</article>
                    
                </div>
            </div>
        </div>
    
    </main>

    <script src="../../nav.js"></script>
</body>
</html>
