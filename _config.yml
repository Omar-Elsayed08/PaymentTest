# GitHub Pages publishes every file in this repo. The entries below are server
# code or build tooling, so they are kept out of the published site. No secrets
# live in them, but there is no reason to serve them either.
#
# This list replaces Jekyll's defaults, which is why node_modules and vendor
# are repeated here.
exclude:
  - backend
  - dist
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - wrangler.toml
  - README.md
  - .env.example
