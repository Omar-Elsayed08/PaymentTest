name = ""
main = ""
compatibility_date = ""
compatibility_flags = ["nodejs_compat"]

# dist/ is produced by `npm run build`. Requests under /api/ run the Worker,
# everything else is served as a static file.
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# Serve .html paths as written instead of redirecting to extensionless URLs,
# so links like cart/cart.html keep working.
html_handling = "none"

# Non-secret settings. Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) are
# set with `wrangler secret put` and never live in this file.
[vars]
# The site lives on GitHub Pages, so Stripe sends shoppers back there, not to
# the workers.dev URL that runs the API.
PUBLIC_BASE_URL = ""
CURRENCY = "usd"
SHIPPING_CENTS = "800"
MAX_QTY_PER_LINE = "20"
MAX_CART_LINES = "30"
ALLOWED_SHIPPING_COUNTRIES = "US,CA"
# The Pages domain is on a different host than this Worker, so it has to be
# allowed to call the API from the browser.
ALLOWED_ORIGINS = ""
